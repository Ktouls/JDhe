name: build-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python3 -m pip install --upgrade pip fonttools

      - name: Rebuild site and assessment
        run: |
          python3 scripts/build.py
          python3 scripts/assess.py

      - name: Check generated files are up to date
        run: |
          git diff --exit-code -- index.html zigen-chart.svg src/zigen-chart.svg src/assess.json