name: build-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python3 -m pip install --upgrade pip fonttools

      - name: Save baseline generated files
        run: |
          mkdir -p /tmp/baseline/src /tmp/baseline/assets
          cp index.html /tmp/baseline/index.html
          cp zigen-chart.svg /tmp/baseline/zigen-chart.svg
          cp src/zigen-chart.svg /tmp/baseline/src/zigen-chart.svg
          cp src/assess.json /tmp/baseline/src/assess.json
          cp assets/dict-core.gz /tmp/baseline/assets/dict-core.gz
          cp assets/dict-search.gz /tmp/baseline/assets/dict-search.gz
          cp assets/chaifen.gz /tmp/baseline/assets/chaifen.gz

      - name: Rebuild site and assessment
        run: |
          python3 scripts/build.py
          python3 scripts/assess.py

      # index.html 内嵌的词库是 gzip 结果，字节会随 Python/zlib 版本变化，
      # 因此用脚本做归一化比对，而不是直接 git diff。
      - name: Check generated files are up to date
        run: python3 scripts/check-generated.py /tmp/baseline